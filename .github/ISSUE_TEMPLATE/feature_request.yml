name: Feature request
description: Suggest an improvement for CredForge
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Before submitting, check the project constraints in CONTRIBUTING.md — zero dependencies, single-file core, synthetic-only data, and realism over volume.
  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What are you trying to accomplish? What gap does this fill?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should it work? CLI flag, new format, new country, etc.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, and why this one wins
  - type: checkboxes
    id: fit
    attributes:
      label: Project fit
      description: Confirm the proposal respects project constraints
      options:
        - label: Stays zero-dependency (Python 3.6+ stdlib only)
        - label: Uses only synthetic data — no real breach/leak material
        - label: Improves statistical realism rather than pure randomness
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Examples, mock output, references
